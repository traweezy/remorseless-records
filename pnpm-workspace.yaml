packages:
  - backend
  - storefront

hoistPattern:
  - "*"
  - "!@types/react"
  - "!@types/react-dom"

allowBuilds:
  "@medusajs/telemetry": true
  "@railway/cli": true
  "@swc/core": true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  puppeteer: false
  sharp: true
  unrs-resolver: true

resolvePeersFromWorkspaceRoot: false

packageExtensions:
  "@medusajs/framework@2.18.0":
    dependencies:
      typescript: 5.9.3
  "@medusajs/icons@2.18.0":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@medusajs/ui@4.2.0":
    peerDependencies:
      "@types/react": "*"
      "@types/react-dom": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
      "@types/react-dom":
        optional: true
  "lucide-react@1.27.0":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "puppeteer-core@>=24.43.1 <26.0.0":
    dependencies:
      proxy-agent: 8.0.2
  "next@16.3.3":
    peerDependencies:
      "@types/react": "*"
      "@types/react-dom": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
      "@types/react-dom":
        optional: true

