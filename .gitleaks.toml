title = "Remorseless Records Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Ignore deterministic cart-cookie signing keys used only by unit tests"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^(0123456789abcdef0123456789abcdef|abcdef0123456789abcdef0123456789|fedcba9876543210fedcba9876543210)$''',
]
paths = ['''^storefront/src/lib/cart/cookie\.test\.ts$''']

[[rules.allowlists]]
description = "Ignore the historical synthetic tax-control idempotency fixture"
condition = "AND"
regexTarget = "secret"
regexes = ['''^6bcb5a26-6f8a-4c13-9c39-0f28dd41fb81$''']
paths = ['''^backend/src/admin/routes/tax-control/query\.test\.ts$''']

[[rules.allowlists]]
description = "Ignore synthetic shelf-authoring idempotency fixtures"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^(8bff4ab1-0d8b-4b73-a928-856272bfac81|26a5c95d-0271-4fd9-a296-9e7275e6fddd)$''',
]
paths = [
  '''^backend/src/api/admin/catalog/shelves/helpers\.test\.ts$''',
  '''^backend/src/lib/catalog/shelf-persistence-contracts\.test\.ts$''',
]

[[rules.allowlists]]
description = "Ignore synthetic content-authoring idempotency fixtures"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^(57fb5c69-d829-47c3-a877-19c15add6137|64d0f078-50fe-428e-80e3-a628750353ad|98c549f3-31d0-462f-854c-45f5796a9de9|0a22bb15-6cf4-4881-85ef-afb817a94b47)$''',
]
paths = [
  '''^backend/src/api/admin/discography/helpers\.test\.ts$''',
  '''^backend/src/lib/content/persistence-contracts\.test\.ts$''',
]

[[rules.allowlists]]
description = "Ignore synthetic News contract idempotency fixtures"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^(d8a102f4-c0da-4f50-b846-108503e26488|b650e3d2-dccc-49f1-a55e-0dc6da2b7fd5)$''',
]
paths = ['''^backend/src/api/admin/news/contracts\.test\.ts$''']

[[rules]]
id = "stripe-access-token"

[[rules.allowlists]]
description = "Ignore the removed nonfunctional Stripe SDK placeholder"
condition = "AND"
regexTarget = "secret"
regexes = ['''^sk_(test)_unconfigured$''']
paths = ['''^backend/src/api/webhooks/stripe/lifecycle/route\.ts$''']
