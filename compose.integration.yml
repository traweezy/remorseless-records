name: remorseless-records-integration

services:
  postgres:
    image: docker.io/library/postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: local_integration_only
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${RR_INTEGRATION_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql

  redis:
    image: docker.io/library/redis:8.10.1-alpine3.23@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${RR_INTEGRATION_REDIS_PORT:-56379}:6379"
    tmpfs:
      - /data
