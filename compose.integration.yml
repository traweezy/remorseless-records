name: remorseless-records-integration

services:
  postgres:
    image: remorseless-records-integration-postgres:18.6-hardened
    build:
      context: ./docker/integration
      dockerfile: postgres.Dockerfile
    pull_policy: never
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: local_integration_only
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${RR_INTEGRATION_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql

  redis:
    image: remorseless-records-integration-redis:8.10.1-hardened
    build:
      context: ./docker/integration
      dockerfile: redis.Dockerfile
    pull_policy: never
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${RR_INTEGRATION_REDIS_PORT:-56379}:6379"
    tmpfs:
      - /data

networks:
  default:
    driver: bridge
