openapi: 3.1.0
info:
  title: Remorseless Records API problem contract
  version: 1.4.0
  description: >-
    Shared RFC 7807-compatible error and correlation components for custom
    Backend and Storefront APIs. Endpoint enumeration now covers the legacy key
    exchange, Stripe lifecycle webhook, the complete contact/privacy BFF
    boundary, bounded Storefront search, and the channel-scoped product-handle
    feed. The complete generated route inventory and generic response
    references live in custom-endpoints.generated.json.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
paths:
  /key-exchange:
    get:
      operationId: getPublishableApiKey
      summary: Resolve the legacy Webshop publishable API key
      description: >-
        Legacy discovery endpoint. The current Storefront uses its validated
        environment key instead; external-consumer review is required before
        this endpoint can be retired.
      responses:
        "200":
          description: The browser-safe Store API publishable key.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishableKeyResponse"
        "503":
          $ref: "#/components/responses/ApiProblemResponse"
  /webhooks/stripe/lifecycle:
    post:
      operationId: receiveStripeLifecycleWebhook
      summary: Record and queue a Stripe payment lifecycle event
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: The signed event was accepted or intentionally ignored.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeLifecycleWebhookAck"
        "400":
          $ref: "#/components/responses/ApiProblemResponse"
        "503":
          $ref: "#/components/responses/ApiProblemResponse"
  /api/search/products:
    post:
      operationId: searchStorefrontProducts
      summary: Search the public catalog through the Storefront BFF
      description: >-
        Same-origin, server-only Meilisearch boundary. Requests are limited to
        60 results and the first 1,000 matches. When a filter cannot run in the
        index, at most 2,048 raw hits are examined. The route accepts at most
        24 KiB per request and 120 requests per source address per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSearchRequest"
      responses:
        "200":
          description: A bounded page of normalized public catalog results.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSearchResponse"
        "400":
          $ref: "#/components/responses/ApiProblemResponse"
        "403":
          $ref: "#/components/responses/ApiProblemResponse"
        "413":
          $ref: "#/components/responses/ApiProblemResponse"
        "415":
          $ref: "#/components/responses/ApiProblemResponse"
        "429":
          $ref: "#/components/responses/ApiProblemResponse"
        "500":
          $ref: "#/components/responses/ApiProblemResponse"
  /api/contact:
    post:
      operationId: submitStorefrontContactForm
      summary: Validate and forward a public contact form
      description: >-
        Storefront same-origin BFF. It applies a 16 KiB body limit, local abuse
        control, and an eight-second Backend deadline before generating the
        server-only, body-bound proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "200":
          description: The message was accepted or silently dropped as spam.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/ApiProblemResponse"
        "403":
          $ref: "#/components/responses/ApiProblemResponse"
        "413":
          $ref: "#/components/responses/ApiProblemResponse"
        "415":
          $ref: "#/components/responses/ApiProblemResponse"
        "429":
          $ref: "#/components/responses/ApiProblemResponse"
        "502":
          $ref: "#/components/responses/ApiProblemResponse"
        "503":
          $ref: "#/components/responses/ApiProblemResponse"
        "504":
          $ref: "#/components/responses/ApiProblemResponse"
  /api/privacy-request:
    post:
      operationId: submitStorefrontPrivacyRequest
      summary: Validate and forward a public privacy request
      description: >-
        Storefront same-origin BFF. It applies a 16 KiB body limit, local abuse
        control, and an eight-second Backend deadline before generating the
        server-only, body-bound proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequest"
      responses:
        "200":
          description: The request was accepted or silently dropped as spam.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/ApiProblemResponse"
        "403":
          $ref: "#/components/responses/ApiProblemResponse"
        "413":
          $ref: "#/components/responses/ApiProblemResponse"
        "415":
          $ref: "#/components/responses/ApiProblemResponse"
        "429":
          $ref: "#/components/responses/ApiProblemResponse"
        "502":
          $ref: "#/components/responses/ApiProblemResponse"
        "503":
          $ref: "#/components/responses/ApiProblemResponse"
        "504":
          $ref: "#/components/responses/ApiProblemResponse"
  /store/contact:
    post:
      operationId: deliverContactForm
      summary: Deliver an authenticated Storefront contact form
      description: >-
        Internal Storefront-to-Backend target. The HMAC proof is bound to the
        contact purpose, exact request body, and a 30-second timestamp window.
      parameters:
        - $ref: "#/components/parameters/PublishableApiKey"
        - $ref: "#/components/parameters/PublicFormTimestamp"
        - $ref: "#/components/parameters/PublicFormProof"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "200":
          description: The message was delivered or silently dropped as spam.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/ApiProblemResponse"
        "401":
          $ref: "#/components/responses/ApiProblemResponse"
        "429":
          $ref: "#/components/responses/ApiProblemResponse"
        "503":
          $ref: "#/components/responses/ApiProblemResponse"
  /store/privacy-request:
    post:
      operationId: deliverPrivacyRequest
      summary: Deliver an authenticated Storefront privacy request
      description: >-
        Internal Storefront-to-Backend target. The HMAC proof is bound to the
        privacy-request purpose, exact request body, and a 30-second timestamp
        window.
      parameters:
        - $ref: "#/components/parameters/PublishableApiKey"
        - $ref: "#/components/parameters/PublicFormTimestamp"
        - $ref: "#/components/parameters/PublicFormProof"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequest"
      responses:
        "200":
          description: The request was delivered or silently dropped as spam.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/PrivacyRequestAccepted"
        "400":
          $ref: "#/components/responses/ApiProblemResponse"
        "401":
          $ref: "#/components/responses/ApiProblemResponse"
        "429":
          $ref: "#/components/responses/ApiProblemResponse"
        "503":
          $ref: "#/components/responses/ApiProblemResponse"
  /store/products/handles:
    get:
      operationId: listStoreProductHandles
      summary: List a keyset page of visible product handles
      description: >-
        Returns only published products linked to a sales channel carried by
        the supplied publishable key. The opaque cursor advances over the
        Product-to-Sales-Channel link key and must be returned unchanged.
      parameters:
        - $ref: "#/components/parameters/PublishableApiKey"
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - in: query
          name: cursor
          required: false
          description: Opaque cursor from the preceding page.
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: "^[A-Za-z0-9_-]+$"
      responses:
        "200":
          description: A bounded page of visible product handles.
          headers:
            Cache-Control:
              description: Shared-cache policy for the channel-scoped feed.
              required: true
              schema:
                type: string
            Vary:
              description: Prevents cache reuse across publishable keys.
              required: true
              schema:
                type: string
                const: x-publishable-api-key
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            traceparent:
              $ref: "#/components/headers/Traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductHandlePage"
        "400":
          $ref: "#/components/responses/NativeMedusaErrorResponse"
        "401":
          $ref: "#/components/responses/NativeMedusaErrorResponse"
        "403":
          $ref: "#/components/responses/NativeMedusaErrorResponse"
components:
  headers:
    NoStore:
      description: Prevents storage of security- or retry-sensitive responses.
      required: true
      schema:
        type: string
        enum:
          - no-store
          - no-store, max-age=0
    RequestId:
      description: Bounded request correlation identifier.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
    Traceparent:
      description: W3C trace context for the service response span.
      required: true
      schema:
        type: string
        pattern: "^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"
  parameters:
    PublishableApiKey:
      in: header
      name: x-publishable-api-key
      required: true
      description: Browser-safe Medusa Store API key for the intended channel.
      schema:
        type: string
        minLength: 1
    PublicFormTimestamp:
      in: header
      name: x-rr-form-timestamp
      required: true
      description: Unix timestamp covered by the short-lived BFF proof.
      schema:
        type: integer
        minimum: 1
    PublicFormProof:
      in: header
      name: x-rr-form-proof
      required: true
      description: Base64url HMAC generated only by the Storefront server.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
  responses:
    ApiProblemResponse:
      description: A safe, correlated project-owned API problem.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        traceparent:
          $ref: "#/components/headers/Traceparent"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    NativeMedusaErrorResponse:
      description: A native Medusa validation or Store authentication error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NativeMedusaError"
  schemas:
    OkResponse:
      type: object
      additionalProperties: false
      required:
        - ok
      properties:
        ok:
          type: boolean
          const: true
    ContactRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - reason
        - message
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        reason:
          type: string
          enum:
            - booking
            - press
            - collab
            - other
        message:
          type: string
          minLength: 10
          maxLength: 5000
        honeypot:
          type: string
    PrivacyRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - requestType
        - details
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        requestType:
          type: string
          enum:
            - access
            - delete
            - correct
            - optout
            - other
        details:
          type: string
          minLength: 10
          maxLength: 5000
        orderId:
          type: string
          maxLength: 120
        honeypot:
          type: string
    PrivacyRequestAccepted:
      type: object
      additionalProperties: false
      required:
        - ok
        - request_id
      properties:
        ok:
          type: boolean
          const: true
        request_id:
          type: string
          format: uuid
    PublishableKeyResponse:
      type: object
      additionalProperties: false
      required:
        - publishableApiKey
      properties:
        publishableApiKey:
          type: string
          minLength: 1
    StripeLifecycleWebhookAck:
      type: object
      additionalProperties: false
      required:
        - received
      properties:
        received:
          type: boolean
          const: true
        ignored:
          type: boolean
        replayed:
          type: boolean
    ProductSearchRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          maxLength: 160
        limit:
          type: integer
          minimum: 1
          maximum: 60
          default: 24
        offset:
          type: integer
          minimum: 0
          maximum: 999
          default: 0
          description: Must satisfy offset + limit <= 1,000.
        sort:
          type: string
          default: newest
          enum:
            - artist-asc
            - artist-desc
            - title-asc
            - title-desc
            - newest
            - price-low
            - price-high
        inStockOnly:
          type: boolean
          default: false
        filters:
          $ref: "#/components/schemas/ProductSearchFilters"
    ProductSearchFilters:
      type: object
      additionalProperties: false
      properties:
        genres:
          type: array
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 120
        formats:
          type: array
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 120
        categories:
          type: array
          maxItems: 40
          items:
            type: string
            minLength: 1
            maxLength: 160
        variants:
          type: array
          maxItems: 40
          items:
            type: string
            minLength: 1
            maxLength: 160
        productTypes:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 120
        availability:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 80
        price:
          type: object
          additionalProperties: false
          description: Minimum price must not exceed maximum price.
          properties:
            min:
              type: integer
              minimum: 0
              maximum: 1000000
            max:
              type: integer
              minimum: 0
              maximum: 1000000
    ProductSearchResponse:
      type: object
      additionalProperties: false
      required:
        - hits
        - total
        - facets
        - offset
      properties:
        hits:
          type: array
          maxItems: 60
          items:
            $ref: "#/components/schemas/ProductSearchHit"
        total:
          type: integer
          minimum: 0
          maximum: 1000
        facets:
          $ref: "#/components/schemas/ProductSearchFacets"
        offset:
          type: integer
          minimum: 0
          maximum: 999
        hasMore:
          type: boolean
        nextOffset:
          type: integer
          minimum: 1
          maximum: 1000
    ProductSearchHit:
      type: object
      required:
        - id
        - handle
        - title
        - artist
        - album
      properties:
        id:
          type: string
          minLength: 1
        handle:
          type: string
          minLength: 1
        title:
          type: string
        artist:
          type: string
        album:
          type: string
      additionalProperties: true
    ProductSearchFacets:
      type: object
      additionalProperties: false
      required:
        - genres
        - metalGenres
        - format
        - categories
        - variants
        - productTypes
        - availabilityStates
        - stockStatuses
        - bundleTypes
      properties:
        genres:
          $ref: "#/components/schemas/FacetMap"
        metalGenres:
          $ref: "#/components/schemas/FacetMap"
        format:
          $ref: "#/components/schemas/FacetMap"
        categories:
          $ref: "#/components/schemas/FacetMap"
        variants:
          $ref: "#/components/schemas/FacetMap"
        productTypes:
          $ref: "#/components/schemas/FacetMap"
        availabilityStates:
          $ref: "#/components/schemas/FacetMap"
        stockStatuses:
          $ref: "#/components/schemas/FacetMap"
        bundleTypes:
          $ref: "#/components/schemas/FacetMap"
    FacetMap:
      type: object
      additionalProperties:
        type: integer
        minimum: 0
    ProductHandlePage:
      type: object
      additionalProperties: false
      required:
        - handles
        - next_cursor
      properties:
        handles:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ProductHandleRecord"
        next_cursor:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]+$"
    ProductHandleRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - handle
        - created_at
        - updated_at
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        handle:
          type: string
          minLength: 1
          maxLength: 200
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    NativeMedusaError:
      type: object
      additionalProperties: false
      required:
        - message
        - type
      properties:
        code:
          type: string
        message:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
      description: >-
        Native Medusa error envelope retained for Admin SDK, Dashboard,
        authentication, authorization, and ordinary Medusa route compatibility.
    ApiProblemFieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    ApiProblem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
        - instance
        - request_id
        - trace_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        code:
          type: string
          pattern: "^[a-z][a-z0-9_-]{1,79}$"
        instance:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        trace_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        errors:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ApiProblemFieldError"
      additionalProperties: true
