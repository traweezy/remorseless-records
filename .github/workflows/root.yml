name: Root CI

on:
  push:
    branches: [staging, master]
  pull_request:
    branches: [staging, master]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  dependency-review:
    if: ${{ contains(fromJson('["pull_request","merge_group"]'), github.event_name) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  security:
    name: Security & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shai-Hulud 2.0 Detector
        uses: gensecaihq/Shai-Hulud-2.0-Detector@e42b26d04fb7a7a9872e6b9f449f65f9b36aba98 # v2.1.0
        with:
          fail-on-critical: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: Trivy FS scan (repo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          skip-dirs: node_modules
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release branch policy
        run: pnpm run qa:release-policy
      - name: Verify Railway deployment contract
        run: pnpm run qa:railway-iac
      - name: Verify private artifact boundaries
        run: pnpm run qa:secure-artifacts
      - name: Verify generated API contract
        run: pnpm run qa:api-contract
      - name: Verify Medusa global response-header boundary
        run: pnpm run qa:framework-response-headers
      - name: Verify Railway runtime-log acceptance boundary
        run: pnpm run qa:railway-runtime-logs
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=moderate
      - name: Verify browser QA dependency boundary
        run: pnpm run qa:browser-toolchain-security
      - name: Verify Medusa build compiler boundary
        run: pnpm run qa:medusa-build-toolchain
      - name: Verify Dashboard product import boundary
        run: pnpm run qa:dashboard-product-import
      - name: Verify Dashboard product deletion boundary
        run: pnpm run qa:dashboard-product-deletion
      - name: Verify checkout recovery idempotency boundary
        run: pnpm run qa:checkout-recovery
      - name: Verify commerce reliability matrix
        run: pnpm run qa:commerce-reliability
      - name: Verify external scheduler observation boundary
        run: pnpm run qa:scheduler-observation
      - name: Verify React Router security backports
        run: pnpm run qa:react-router-security

  supply-chain-artifacts:
    name: SBOM & Production Licenses
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create production license inventory
        run: |
          mkdir -p artifacts
          pnpm licenses list --prod --json > artifacts/production-licenses.json
      - name: Create CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: cyclonedx
          output: artifacts/sbom.cdx.json
          skip-dirs: node_modules
      - name: Verify supply-chain artifacts
        run: >-
          node scripts/verify-supply-chain-artifacts.mjs
          artifacts/sbom.cdx.json
          artifacts/production-licenses.json
      - name: Retain supply-chain artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: ./.github/actions/gitleaks
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --only-verified
