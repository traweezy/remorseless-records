name: Runtime Images

on:
  push:
    branches: [staging, master]
  pull_request:
    branches: [staging, master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immutable images and attestations
        required: true
        default: false
        type: boolean

concurrency:
  group: runtime-images-${{ github.ref }}
  cancel-in-progress: true

env:
  ADMIN_CORS: http://127.0.0.1:3000
  AUTH_CORS: http://127.0.0.1:3000
  BACKEND_PUBLIC_URL: http://127.0.0.1:9000
  CART_COOKIE_SECRET: ci-runtime-cart-cookie-20260827-alpha
  CHECKOUT_BFF_SECRET: ci-runtime-checkout-bff-20260827-bravo
  CHECKOUT_RECEIPT_SECRET: ci-runtime-checkout-receipt-20260827-charlie
  CI: true
  CI_MEDUSA_FIXTURE_URL: http://127.0.0.1:4010
  CI_MEDUSA_PUBLISHABLE_KEY: pk_ci_storefront_fixture_20260831
  COOKIE_SECRET: ci-runtime-backend-cookie-20260902
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/remorseless
  JWT_SECRET: ci-runtime-backend-jwt-20260902
  MEILISEARCH_ADMIN_KEY: ci-runtime-admin-key-20260902
  MEDUSA_BACKEND_URL: http://127.0.0.1:4010
  MEILISEARCH_HOST: http://127.0.0.1:7700
  MEILISEARCH_SEARCH_KEY: ci-runtime-search-key-20260901
  NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://127.0.0.1:4010
  NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_storefront_fixture_20260831
  NEXT_PUBLIC_MEDUSA_URL: http://127.0.0.1:4010
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_STRIPE_PK: pk_test_runtime_image_fixture
  NEXT_TELEMETRY_DISABLED: 1
  NODE_ENV: production
  PUBLIC_FORM_BFF_SECRET: ci-runtime-public-form-bff-20260827-delta
  STORE_CORS: http://127.0.0.1:3000

jobs:
  validate:
    name: Validate runtime image (${{ matrix.service }})
    if: ${{ github.ref != 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.publish != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            build_command: pnpm --filter backend run build
            build_node_environment: test
            dockerfile: backend/Dockerfile.runtime
            image_name: ghcr.io/traweezy/remorseless-records-backend
          - service: storefront
            build_command: pnpm --filter remorseless-records-storefront run build:runtime
            build_node_environment: production
            dockerfile: storefront/Dockerfile.runtime
            image_name: ghcr.io/traweezy/remorseless-records-storefront
    env:
      IMAGE_REF: ${{ matrix.image_name }}:${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            check.trivy.dev:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            gcr.io:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            security.debian.org:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Shai-Hulud 2.0 Detector
        uses: gensecaihq/Shai-Hulud-2.0-Detector@2755f94762bf5012bc7be82c93e172eabbcd0802 # v2.2.0
        with:
          fail-on-critical: true
          fail-on-high: true
          scan-lockfiles: true
          scan-node-modules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runtime image policy
        run: pnpm run qa:runtime-images

      - name: Verify CI runtime security policy
        run: pnpm run qa:ci-runtime-security

      - name: Start deterministic Medusa fixture
        if: ${{ matrix.service == 'storefront' }}
        shell: bash
        run: |
          fixture_log="${RUNNER_TEMP}/runtime-image-medusa-fixture.log"
          node storefront/scripts/ci-medusa-fixture.mjs > "$fixture_log" 2>&1 &
          fixture_pid=$!
          echo "CI_MEDUSA_FIXTURE_PID=${fixture_pid}" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              "${CI_MEDUSA_FIXTURE_URL}/live" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 50 "$fixture_log"
          exit 1

      - name: Build application artifact
        env:
          NODE_ENV: ${{ matrix.build_node_environment }}
        run: ${{ matrix.build_command }}

      - name: Stop deterministic Medusa fixture
        if: ${{ always() && matrix.service == 'storefront' }}
        shell: bash
        run: |
          if [[ "${CI_MEDUSA_FIXTURE_PID:-}" =~ ^[0-9]+$ ]]; then
            kill "${CI_MEDUSA_FIXTURE_PID}" 2>/dev/null || true
            wait "${CI_MEDUSA_FIXTURE_PID}" 2>/dev/null || true
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build immutable runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: REVISION=${{ github.sha }}
          load: true
          provenance: false
          push: false
          tags: ${{ env.IMAGE_REF }}

      - name: Resolve local runtime image digest
        id: image
        shell: bash
        run: |
          image_digest="$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            exit 1
          fi
          echo "digest=${image_digest}" >> "$GITHUB_OUTPUT"

      - name: Smoke exact runtime image
        shell: bash
        run: |
          docker run --rm --entrypoint /usr/local/bin/node "${IMAGE_REF}" -e \
            'const a=require("node:assert/strict"),c=require("node:crypto"),f=require("node:fs");a.equal(process.getuid(),1000);a.equal(process.version,"v26.9.0");const hashes={x64:"05757b064ad2a221b41874794da42361c9bab033c7c33c1f1b458c25a7de7e59",arm64:"53a18c9a23bac8635ea9eb9cdef98e4b7bb77e0420cc966fb371a566ce22c763"},libs={x64:"107ab9f7661a1c47cddfb5cd1def99ec537a50a9a537fbe38cdde1b34b8ba280",arm64:"c90c21008853899dfa102eeaa43b703c2bf41553dd56b13aac6da2803d5884b7"},sha=(p)=>c.createHash("sha256").update(f.readFileSync(p)).digest("hex");a.equal(sha("/usr/local/bin/node"),hashes[process.arch]);a.equal(sha("/usr/local/lib/libatomic.so.1"),libs[process.arch]);for(const p of ["/bin/sh","/usr/local/bin/npm","/usr/local/bin/npx"])a.equal(f.existsSync(p),false)'
          if [ "${{ matrix.service }}" = "backend" ]; then
            docker run --rm --entrypoint /usr/local/bin/node "${IMAGE_REF}" -e \
              'const a=require("node:assert/strict"),f=require("node:fs");for(const p of ["./node_modules/@medusajs/cli/cli.js","./scripts/runtime-release-prepare.mjs"])a.equal(f.existsSync(p),true)'
            exit 0
          fi

          container_name="runtime-storefront-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker stop "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --rm -d --name "$container_name" \
            -p 127.0.0.1:3000:3000 \
            -e CART_COOKIE_SECRET \
            -e CHECKOUT_BFF_SECRET \
            -e CHECKOUT_RECEIPT_SECRET \
            -e MEDUSA_BACKEND_URL \
            -e MEILISEARCH_HOST \
            -e MEILISEARCH_SEARCH_KEY \
            -e PUBLIC_FORM_BFF_SECRET \
            "${IMAGE_REF}" >/dev/null
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:3000/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_name"
          exit 1

      - name: Test packaged Storefront image decoders
        if: ${{ matrix.service == 'storefront' }}
        timeout-minutes: 2
        shell: bash
        run: |
          image_id="${{ steps.image.outputs.digest }}"
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            exit 1
          fi
          container_id="$(docker create --pull never \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 256m --cpus 1 --pids-limit 64 \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/storefront/scripts/image-optimizer.runtime.test.mjs,target=/app/storefront/image-optimizer.runtime.test.mjs,readonly" \
            --entrypoint node "$image_id" \
            --test --test-isolation=process --test-timeout=30000 \
            /app/storefront/image-optimizer.runtime.test.mjs)"
          if [[ ! "$container_id" =~ ^[0-9a-f]{64}$ ]]; then
            exit 1
          fi
          cleanup() {
            timeout --signal=TERM --kill-after=5s 10s docker rm --force "$container_id" >/dev/null
          }
          trap cleanup EXIT
          timeout --signal=TERM --kill-after=10s 45s docker start --attach "$container_id"
          test "$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$container_id")" = 'exited 0'

      - name: Setup reviewed runtime scanner
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: false

      - name: Scan runtime image for critical and high vulnerabilities
        timeout-minutes: 16
        shell: bash
        run: |
          node scripts/scan-runtime-image.mjs \
            --service "${{ matrix.service }}" \
            --revision "${GITHUB_SHA}" \
            --image-id "${{ steps.image.outputs.digest }}" \
            --output artifacts

      - name: Retain runtime image evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-image-${{ matrix.service }}-${{ github.sha }}
          path: |
            artifacts/*.image.json
            artifacts/*.vuln.json
            artifacts/*.cdx.json
            artifacts/*.db.json
            artifacts/*.manifest.json
            artifacts/*.descriptor.json
            artifacts/failure.json
            artifacts/publication-failure.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish runtime image (${{ matrix.service }})
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            build_command: pnpm --filter backend run build
            build_node_environment: test
            dockerfile: backend/Dockerfile.runtime
            image_name: ghcr.io/traweezy/remorseless-records-backend
          - service: storefront
            build_command: pnpm --filter remorseless-records-storefront run build:runtime
            build_node_environment: production
            dockerfile: storefront/Dockerfile.runtime
            image_name: ghcr.io/traweezy/remorseless-records-storefront
    env:
      IMAGE_REF: ${{ matrix.image_name }}:${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            check.trivy.dev:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            gcr.io:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            security.debian.org:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Shai-Hulud 2.0 Detector
        uses: gensecaihq/Shai-Hulud-2.0-Detector@2755f94762bf5012bc7be82c93e172eabbcd0802 # v2.2.0
        with:
          fail-on-critical: true
          fail-on-high: true
          scan-lockfiles: true
          scan-node-modules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runtime image policy
        run: pnpm run qa:runtime-images

      - name: Verify CI runtime security policy
        run: pnpm run qa:ci-runtime-security

      - name: Start deterministic Medusa fixture
        if: ${{ matrix.service == 'storefront' }}
        shell: bash
        run: |
          fixture_log="${RUNNER_TEMP}/runtime-image-medusa-fixture.log"
          node storefront/scripts/ci-medusa-fixture.mjs > "$fixture_log" 2>&1 &
          fixture_pid=$!
          echo "CI_MEDUSA_FIXTURE_PID=${fixture_pid}" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              "${CI_MEDUSA_FIXTURE_URL}/live" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 50 "$fixture_log"
          exit 1

      - name: Build application artifact
        env:
          NODE_ENV: ${{ matrix.build_node_environment }}
        run: ${{ matrix.build_command }}

      - name: Stop deterministic Medusa fixture
        if: ${{ always() && matrix.service == 'storefront' }}
        shell: bash
        run: |
          if [[ "${CI_MEDUSA_FIXTURE_PID:-}" =~ ^[0-9]+$ ]]; then
            kill "${CI_MEDUSA_FIXTURE_PID}" 2>/dev/null || true
            wait "${CI_MEDUSA_FIXTURE_PID}" 2>/dev/null || true
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build immutable runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: REVISION=${{ github.sha }}
          load: true
          provenance: false
          push: false
          tags: ${{ env.IMAGE_REF }}

      - name: Resolve local runtime image digest
        id: local_image
        shell: bash
        run: |
          image_digest="$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            exit 1
          fi
          echo "digest=${image_digest}" >> "$GITHUB_OUTPUT"

      - name: Smoke exact runtime image
        shell: bash
        run: |
          docker run --rm --entrypoint /usr/local/bin/node "${IMAGE_REF}" -e \
            'const a=require("node:assert/strict"),c=require("node:crypto"),f=require("node:fs");a.equal(process.getuid(),1000);a.equal(process.version,"v26.9.0");const hashes={x64:"05757b064ad2a221b41874794da42361c9bab033c7c33c1f1b458c25a7de7e59",arm64:"53a18c9a23bac8635ea9eb9cdef98e4b7bb77e0420cc966fb371a566ce22c763"},libs={x64:"107ab9f7661a1c47cddfb5cd1def99ec537a50a9a537fbe38cdde1b34b8ba280",arm64:"c90c21008853899dfa102eeaa43b703c2bf41553dd56b13aac6da2803d5884b7"},sha=(p)=>c.createHash("sha256").update(f.readFileSync(p)).digest("hex");a.equal(sha("/usr/local/bin/node"),hashes[process.arch]);a.equal(sha("/usr/local/lib/libatomic.so.1"),libs[process.arch]);for(const p of ["/bin/sh","/usr/local/bin/npm","/usr/local/bin/npx"])a.equal(f.existsSync(p),false)'
          if [ "${{ matrix.service }}" = "backend" ]; then
            docker run --rm --entrypoint /usr/local/bin/node "${IMAGE_REF}" -e \
              'const a=require("node:assert/strict"),f=require("node:fs");for(const p of ["./node_modules/@medusajs/cli/cli.js","./scripts/runtime-release-prepare.mjs"])a.equal(f.existsSync(p),true)'
            exit 0
          fi

          container_name="runtime-storefront-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker stop "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --rm -d --name "$container_name" \
            -p 127.0.0.1:3000:3000 \
            -e CART_COOKIE_SECRET \
            -e CHECKOUT_BFF_SECRET \
            -e CHECKOUT_RECEIPT_SECRET \
            -e MEDUSA_BACKEND_URL \
            -e MEILISEARCH_HOST \
            -e MEILISEARCH_SEARCH_KEY \
            -e PUBLIC_FORM_BFF_SECRET \
            "${IMAGE_REF}" >/dev/null
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:3000/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_name"
          exit 1

      - name: Test packaged Storefront image decoders
        if: ${{ matrix.service == 'storefront' }}
        timeout-minutes: 2
        shell: bash
        run: |
          image_id="${{ steps.local_image.outputs.digest }}"
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            exit 1
          fi
          container_id="$(docker create --pull never \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 256m --cpus 1 --pids-limit 64 \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/storefront/scripts/image-optimizer.runtime.test.mjs,target=/app/storefront/image-optimizer.runtime.test.mjs,readonly" \
            --entrypoint node "$image_id" \
            --test --test-isolation=process --test-timeout=30000 \
            /app/storefront/image-optimizer.runtime.test.mjs)"
          if [[ ! "$container_id" =~ ^[0-9a-f]{64}$ ]]; then
            exit 1
          fi
          cleanup() {
            timeout --signal=TERM --kill-after=5s 10s docker rm --force "$container_id" >/dev/null
          }
          trap cleanup EXIT
          timeout --signal=TERM --kill-after=10s 45s docker start --attach "$container_id"
          test "$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$container_id")" = 'exited 0'

