name: Runtime Images

on:
  push:
    branches: [staging, master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immutable images and attestations
        required: true
        default: false
        type: boolean

concurrency:
  group: runtime-images-${{ github.ref }}
  cancel-in-progress: true

env:
  ADMIN_CORS: http://127.0.0.1:3000
  AUTH_CORS: http://127.0.0.1:3000
  BACKEND_PUBLIC_URL: http://127.0.0.1:9000
  CART_COOKIE_SECRET: ci-runtime-cart-cookie-20260827-alpha
  CHECKOUT_BFF_SECRET: ci-runtime-checkout-bff-20260827-bravo
  CHECKOUT_RECEIPT_SECRET: ci-runtime-checkout-receipt-20260827-charlie
  CI: true
  CI_MEDUSA_FIXTURE_URL: http://127.0.0.1:4010
  CI_MEDUSA_PUBLISHABLE_KEY: pk_ci_storefront_fixture_20260831
  COOKIE_SECRET: ci-runtime-backend-cookie-20260902
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/remorseless
  JWT_SECRET: ci-runtime-backend-jwt-20260902
  MEILISEARCH_ADMIN_KEY: ci-runtime-admin-key-20260902
  MEDUSA_BACKEND_URL: http://127.0.0.1:4010
  MEILISEARCH_HOST: http://127.0.0.1:7700
  MEILISEARCH_SEARCH_KEY: ci-runtime-search-key-20260901
  NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://127.0.0.1:4010
  NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_storefront_fixture_20260831
  NEXT_PUBLIC_MEDUSA_URL: http://127.0.0.1:4010
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_STRIPE_PK: pk_test_runtime_image_fixture
  NEXT_TELEMETRY_DISABLED: 1
  NODE_ENV: production
  PUBLIC_FORM_BFF_SECRET: ci-runtime-public-form-bff-20260827-delta
  STORE_CORS: http://127.0.0.1:3000

jobs:
  validate:
    name: Validate runtime image (${{ matrix.service }})
    if: ${{ github.ref != 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.publish != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            build_command: pnpm --filter backend run build
            build_node_environment: test
            dockerfile: backend/Dockerfile.runtime
            image_name: ghcr.io/traweezy/remorseless-records-backend
          - service: storefront
            build_command: pnpm --filter remorseless-records-storefront run build
            build_node_environment: production
            dockerfile: storefront/Dockerfile.runtime
            image_name: ghcr.io/traweezy/remorseless-records-storefront
    env:
      IMAGE_REF: ${{ matrix.image_name }}:${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            check.trivy.dev:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            ghcr.io:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Shai-Hulud 2.0 Detector
        uses: gensecaihq/Shai-Hulud-2.0-Detector@2755f94762bf5012bc7be82c93e172eabbcd0802 # v2.2.0
        with:
          fail-on-critical: true
          scan-lockfiles: true
          scan-node-modules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runtime image policy
        run: pnpm run qa:runtime-images

      - name: Verify CI runtime security policy
        run: pnpm run qa:ci-runtime-security

      - name: Start deterministic Medusa fixture
        if: ${{ matrix.service == 'storefront' }}
        shell: bash
        run: |
          fixture_log="${RUNNER_TEMP}/runtime-image-medusa-fixture.log"
          node storefront/scripts/ci-medusa-fixture.mjs > "$fixture_log" 2>&1 &
          fixture_pid=$!
          echo "CI_MEDUSA_FIXTURE_PID=${fixture_pid}" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              "${CI_MEDUSA_FIXTURE_URL}/live" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 50 "$fixture_log"
          exit 1

      - name: Build application artifact
        env:
          NODE_ENV: ${{ matrix.build_node_environment }}
        run: ${{ matrix.build_command }}

      - name: Stop deterministic Medusa fixture
        if: ${{ always() && matrix.service == 'storefront' }}
        shell: bash
        run: |
          if [[ "${CI_MEDUSA_FIXTURE_PID:-}" =~ ^[0-9]+$ ]]; then
            kill "${CI_MEDUSA_FIXTURE_PID}" 2>/dev/null || true
            wait "${CI_MEDUSA_FIXTURE_PID}" 2>/dev/null || true
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build immutable runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: REVISION=${{ github.sha }}
          load: true
          provenance: false
          push: false
          tags: ${{ env.IMAGE_REF }}

      - name: Resolve local runtime image digest
        id: image
        shell: bash
        run: |
          image_digest="$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            exit 1
          fi
          echo "digest=${image_digest}" >> "$GITHUB_OUTPUT"

      - name: Smoke exact runtime image
        shell: bash
        run: |
          docker run --rm --entrypoint /bin/sh "${IMAGE_REF}" -c \
            'test "$(id -u)" = 1000 && test "$(node --version)" = v26.5.0 && test -z "$(command -v npm)" && test -z "$(command -v npx)"'
          if [ "${{ matrix.service }}" = "backend" ]; then
            docker run --rm --entrypoint /bin/sh "${IMAGE_REF}" -c \
              'test -f ./node_modules/@medusajs/cli/cli.js && test -f ./scripts/runtime-release-prepare.mjs'
            exit 0
          fi

          container_name="runtime-storefront-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker stop "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --rm -d --name "$container_name" \
            -p 127.0.0.1:3000:3000 \
            -e CART_COOKIE_SECRET \
            -e CHECKOUT_BFF_SECRET \
            -e CHECKOUT_RECEIPT_SECRET \
            -e MEDUSA_BACKEND_URL \
            -e MEILISEARCH_HOST \
            -e MEILISEARCH_SEARCH_KEY \
            -e PUBLIC_FORM_BFF_SECRET \
            "${IMAGE_REF}" >/dev/null
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:3000/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_name"
          exit 1

      - name: Scan runtime image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      - name: Prepare private runtime image evidence directory
        shell: bash
        run: install -d -m 0700 artifacts

      - name: Create runtime image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          format: cyclonedx
          output: artifacts/${{ matrix.service }}.cdx.json

      - name: Write and verify runtime image record
        shell: bash
        run: |
          node scripts/write-runtime-image-record.mjs \
            --service "${{ matrix.service }}" \
            --revision "${GITHUB_SHA}" \
            --digest "${{ steps.image.outputs.digest }}" \
            --output "artifacts/${{ matrix.service }}.image.json"
          node scripts/verify-runtime-image-artifacts.mjs \
            "artifacts/${{ matrix.service }}.image.json" \
            "artifacts/${{ matrix.service }}.cdx.json"

      - name: Retain runtime image evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-image-${{ matrix.service }}-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish runtime image (${{ matrix.service }})
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            build_command: pnpm --filter backend run build
            build_node_environment: test
            dockerfile: backend/Dockerfile.runtime
            image_name: ghcr.io/traweezy/remorseless-records-backend
          - service: storefront
            build_command: pnpm --filter remorseless-records-storefront run build
            build_node_environment: production
            dockerfile: storefront/Dockerfile.runtime
            image_name: ghcr.io/traweezy/remorseless-records-storefront
    env:
      IMAGE_REF: ${{ matrix.image_name }}:${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            check.trivy.dev:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            ghcr.io:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Shai-Hulud 2.0 Detector
        uses: gensecaihq/Shai-Hulud-2.0-Detector@2755f94762bf5012bc7be82c93e172eabbcd0802 # v2.2.0
        with:
          fail-on-critical: true
          scan-lockfiles: true
          scan-node-modules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runtime image policy
        run: pnpm run qa:runtime-images

      - name: Verify CI runtime security policy
        run: pnpm run qa:ci-runtime-security

      - name: Start deterministic Medusa fixture
        if: ${{ matrix.service == 'storefront' }}
        shell: bash
        run: |
          fixture_log="${RUNNER_TEMP}/runtime-image-medusa-fixture.log"
          node storefront/scripts/ci-medusa-fixture.mjs > "$fixture_log" 2>&1 &
          fixture_pid=$!
          echo "CI_MEDUSA_FIXTURE_PID=${fixture_pid}" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              "${CI_MEDUSA_FIXTURE_URL}/live" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 50 "$fixture_log"
          exit 1

      - name: Build application artifact
        env:
          NODE_ENV: ${{ matrix.build_node_environment }}
        run: ${{ matrix.build_command }}

      - name: Stop deterministic Medusa fixture
        if: ${{ always() && matrix.service == 'storefront' }}
        shell: bash
        run: |
          if [[ "${CI_MEDUSA_FIXTURE_PID:-}" =~ ^[0-9]+$ ]]; then
            kill "${CI_MEDUSA_FIXTURE_PID}" 2>/dev/null || true
            wait "${CI_MEDUSA_FIXTURE_PID}" 2>/dev/null || true
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build immutable runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: REVISION=${{ github.sha }}
          load: true
          provenance: false
          push: false
          tags: ${{ env.IMAGE_REF }}

      - name: Smoke exact runtime image
        shell: bash
        run: |
          docker run --rm --entrypoint /bin/sh "${IMAGE_REF}" -c \
            'test "$(id -u)" = 1000 && test "$(node --version)" = v26.5.0 && test -z "$(command -v npm)" && test -z "$(command -v npx)"'
          if [ "${{ matrix.service }}" = "backend" ]; then
            docker run --rm --entrypoint /bin/sh "${IMAGE_REF}" -c \
              'test -f ./node_modules/@medusajs/cli/cli.js && test -f ./scripts/runtime-release-prepare.mjs'
            exit 0
          fi

          container_name="runtime-storefront-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker stop "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --rm -d --name "$container_name" \
            -p 127.0.0.1:3000:3000 \
            -e CART_COOKIE_SECRET \
            -e CHECKOUT_BFF_SECRET \
            -e CHECKOUT_RECEIPT_SECRET \
            -e MEDUSA_BACKEND_URL \
            -e MEILISEARCH_HOST \
            -e MEILISEARCH_SEARCH_KEY \
            -e PUBLIC_FORM_BFF_SECRET \
            "${IMAGE_REF}" >/dev/null
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:3000/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_name"
          exit 1

      - name: Scan runtime image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push exact runtime image
        shell: bash
        run: docker push "${IMAGE_REF}"

      - name: Resolve published runtime image digest
        id: image
        shell: bash
        run: |
          image_digest="sha256:$(docker buildx imagetools inspect --raw "${IMAGE_REF}" | sha256sum | cut -d ' ' -f 1)"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            exit 1
          fi
          echo "digest=${image_digest}" >> "$GITHUB_OUTPUT"

      - name: Prepare private runtime image evidence directory
        shell: bash
        run: install -d -m 0700 artifacts

      - name: Create runtime image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ matrix.image_name }}@${{ steps.image.outputs.digest }}
          scanners: vuln
          format: cyclonedx
          output: artifacts/${{ matrix.service }}.cdx.json

      - name: Write and verify runtime image record
        shell: bash
        run: |
          node scripts/write-runtime-image-record.mjs \
            --service "${{ matrix.service }}" \
            --revision "${GITHUB_SHA}" \
            --digest "${{ steps.image.outputs.digest }}" \
            --output "artifacts/${{ matrix.service }}.image.json"
          node scripts/verify-runtime-image-artifacts.mjs \
            "artifacts/${{ matrix.service }}.image.json" \
            "artifacts/${{ matrix.service }}.cdx.json"

      - name: Attest runtime image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.image_name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest runtime image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.image_name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: artifacts/${{ matrix.service }}.cdx.json
          push-to-registry: true

      - name: Retain runtime image evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-image-${{ matrix.service }}-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30
