name: Backend CI

on:
  push:
    branches: [staging, master]
  pull_request:
    branches: [staging, master]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/remorseless
  JWT_SECRET: dummy_jwt_secret
  COOKIE_SECRET: dummy_cookie_secret
  BACKEND_PUBLIC_URL: http://localhost:9000
  ADMIN_CORS: http://localhost:3000
  AUTH_CORS: http://localhost:3000
  STORE_CORS: http://localhost:3000
  STRIPE_API_KEY: sk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_dummy
  STRIPE_PAYMENT_METHOD_CONFIGURATION: pmc_test_dummy
  NODE_ENV: test
  CI: true

jobs:
  dependency-review:
    if: ${{ contains(fromJson('["pull_request","merge_group"]'), github.event_name) }}
    runs-on: ubuntu-latest
    name: Dependency Review (push/PR)
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  security:
    name: Security & Audit (Shai-Hulud, pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Shai-Hulud 2.0 Detector
        uses: gensecaihq/Shai-Hulud-2.0-Detector@2755f94762bf5012bc7be82c93e172eabbcd0802 # v2.2.0
        with:
          fail-on-critical: true
          scan-lockfiles: true
          scan-node-modules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency supply-chain policy
        run: pnpm run qa:dependency-supply-chain
      - name: Verify CI runtime security policy
        run: pnpm run qa:ci-runtime-security
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=moderate
      - name: Verify React Router security backports
        run: pnpm run qa:react-router-security

  secrets:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: ./.github/actions/gitleaks

      - name: TruffleHog (verified only)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --only-verified

  typecheck:
    name: Typecheck + Trivy FS (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: security
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Trivy FS scan (repo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          skip-dirs: node_modules

      - name: Typecheck backend
        run: pnpm --filter backend exec tsc --noEmit

  lint:
    name: Lint (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome (backend)
        run: pnpm --filter backend run lint

  codeql:
    name: CodeQL Analyze (JS/TS, security-extended)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: security
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      CODEQL_ACTION_CACHE_SALT: ${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: javascript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4

  unit:
    name: Unit Tests (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck, codeql, secrets]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with critical-path coverage
        run: pnpm --filter backend run test:coverage

      - name: Upload backend coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-backend
          path: backend/coverage/unit
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Disposable PostgreSQL & Redis Integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [lint, typecheck, secrets]
    permissions:
      contents: read
    env:
      STRIPE_API_KEY: ""
      STRIPE_LIFECYCLE_WEBHOOK_SECRET: ""
      STRIPE_PAYMENT_METHOD_CONFIGURATION: ""
      STRIPE_WEBHOOK_SECRET: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build hardened disposable integration images
        run: docker compose --env-file /dev/null --file compose.integration.yml build

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: false

      - name: Scan exact disposable integration images
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        run: node scripts/scan-disposable-integration-images.mjs --output artifacts/disposable-integration

      - name: Run disposable integration and API contracts
        run: pnpm run qa:disposable-integration --no-build

      - name: Retain disposable image security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: disposable-integration-images
          path: artifacts/disposable-integration
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only build if all checks and unit tests passed
    needs: [unit, integration]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter backend run build

      - name: Enforce Admin bundle budget
        run: node scripts/verify-admin-bundle-budget.mjs

      # Optional: upload built backend artifact for a later deploy workflow
      # - name: Upload backend build artifact
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      #   with:
      #     name: backend-build
      #     path: path/to/backend/dist
