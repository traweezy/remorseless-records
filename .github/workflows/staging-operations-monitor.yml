name: Staging Operations Monitor

on:
  schedule:
    - cron: "8,18,28,38,48,58 * * * *"
    - cron: "3 5 * * *"
  workflow_dispatch:
    inputs:
      force_alert:
        description: Exercise the alert issue path; a healthy run closes it
        required: false
        type: boolean
        default: false

concurrency:
  group: staging-operations-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  observe:
    name: Observe staging operations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CATALOG_HANDLES_URL: https://remorseless-records-admin-staging.up.railway.app/store/products/handles?limit=1
      CATALOG_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
      CATALOG_SHELVES_URL: https://remorseless-records-admin-staging.up.railway.app/store/catalog/shelves
      OPERATIONS_HEALTH_URL: https://remorseless-records-admin-staging.up.railway.app/health/operations
      READY_HEALTH_URL: https://remorseless-records-admin-staging.up.railway.app/ready
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - name: Fetch bounded staging health
        id: fetch
        continue-on-error: true
        run: |
          set -euo pipefail
          monitor_dir="${RUNNER_TEMP}/operations-monitor"
          install -d -m 700 "${monitor_dir}"
          printf '{}\n' > "${monitor_dir}/health.json"
          printf '{}\n' > "${monitor_dir}/handles.json"
          printf '{}\n' > "${monitor_dir}/shelves.json"

          set +e
          operations_status="$(curl \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 5 \
            --max-time 10 \
            --max-filesize 131072 \
            --output "${monitor_dir}/health.next.json" \
            --write-out '%{http_code}' \
            "${OPERATIONS_HEALTH_URL}")"
          operations_exit=$?
          ready_status="$(curl \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 5 \
            --max-time 10 \
            --max-filesize 65536 \
            --output /dev/null \
            --write-out '%{http_code}' \
            "${READY_HEALTH_URL}")"
          ready_exit=$?
          handles_status="$(curl \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 5 \
            --max-time 10 \
            --max-filesize 131072 \
            --header "x-publishable-api-key: ${CATALOG_PUBLISHABLE_KEY}" \
            --output "${monitor_dir}/handles.next.json" \
            --write-out '%{http_code}' \
            "${CATALOG_HANDLES_URL}")"
          handles_exit=$?
          shelves_status="$(curl \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 5 \
            --max-time 10 \
            --max-filesize 131072 \
            --header "x-publishable-api-key: ${CATALOG_PUBLISHABLE_KEY}" \
            --output "${monitor_dir}/shelves.next.json" \
            --write-out '%{http_code}' \
            "${CATALOG_SHELVES_URL}")"
          shelves_exit=$?
          set -e

          if (( operations_exit == 0 )); then
            mv "${monitor_dir}/health.next.json" "${monitor_dir}/health.json"
          fi
          if (( handles_exit == 0 )); then
            mv "${monitor_dir}/handles.next.json" "${monitor_dir}/handles.json"
          fi
          if (( shelves_exit == 0 )); then
            mv "${monitor_dir}/shelves.next.json" "${monitor_dir}/shelves.json"
          fi
          if [[ ! "${operations_status}" =~ ^[0-9]{3}$ ]]; then
            operations_status=0
          fi
          if [[ ! "${ready_status}" =~ ^[0-9]{3}$ ]]; then
            ready_status=0
          fi
          if [[ ! "${handles_status}" =~ ^[0-9]{3}$ ]]; then
            handles_status=0
          fi
          if [[ ! "${shelves_status}" =~ ^[0-9]{3}$ ]]; then
            shelves_status=0
          fi
          printf 'handles_status=%s\n' "${handles_status}" >> "${GITHUB_OUTPUT}"
          printf 'handles_exit=%s\n' "${handles_exit}" >> "${GITHUB_OUTPUT}"
          printf 'operations_status=%s\n' "${operations_status}" >> "${GITHUB_OUTPUT}"
          printf 'ready_status=%s\n' "${ready_status}" >> "${GITHUB_OUTPUT}"
          printf 'operations_exit=%s\n' "${operations_exit}" >> "${GITHUB_OUTPUT}"
          printf 'ready_exit=%s\n' "${ready_exit}" >> "${GITHUB_OUTPUT}"
          printf 'shelves_status=%s\n' "${shelves_status}" >> "${GITHUB_OUTPUT}"
          printf 'shelves_exit=%s\n' "${shelves_exit}" >> "${GITHUB_OUTPUT}"
          if (( operations_exit != 0 || ready_exit != 0 || handles_exit != 0 || shelves_exit != 0 )); then
            exit 1
          fi
      - name: Evaluate and redact observation
        id: evaluate
        continue-on-error: true
        env:
          FORCE_ALERT: ${{ inputs.force_alert }}
          HANDLES_EXIT: ${{ steps.fetch.outputs.handles_exit }}
          HANDLES_STATUS: ${{ steps.fetch.outputs.handles_status }}
          OPERATIONS_EXIT: ${{ steps.fetch.outputs.operations_exit }}
          OPERATIONS_STATUS: ${{ steps.fetch.outputs.operations_status }}
          READY_EXIT: ${{ steps.fetch.outputs.ready_exit }}
          READY_STATUS: ${{ steps.fetch.outputs.ready_status }}
          SHELVES_EXIT: ${{ steps.fetch.outputs.shelves_exit }}
          SHELVES_STATUS: ${{ steps.fetch.outputs.shelves_status }}
        run: |
          set -euo pipefail
          monitor_dir="${RUNNER_TEMP}/operations-monitor"
          artifacts_dir="${RUNNER_TEMP}/operations-monitor-artifacts"
          install -d -m 700 "${artifacts_dir}"
          args=(
            --body-file "${monitor_dir}/health.json"
            --handles-body-file "${monitor_dir}/handles.json"
            --handles-http-status "${HANDLES_STATUS:-0}"
            --http-status "${OPERATIONS_STATUS:-0}"
            --ready-http-status "${READY_STATUS:-0}"
            --shelves-body-file "${monitor_dir}/shelves.json"
            --shelves-http-status "${SHELVES_STATUS:-0}"
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          )
          if [[ "${OPERATIONS_EXIT:-1}" != "0" ]]; then
            args+=(--source-error operations_endpoint_unreachable)
          fi
          if [[ "${READY_EXIT:-1}" != "0" ]]; then
            args+=(--source-error readiness_endpoint_unreachable)
          fi
          if [[ "${HANDLES_EXIT:-1}" != "0" ]]; then
            args+=(--source-error catalog_handles_endpoint_unreachable)
          fi
          if [[ "${SHELVES_EXIT:-1}" != "0" ]]; then
            args+=(--source-error catalog_shelves_endpoint_unreachable)
          fi
          if [[ "${FORCE_ALERT:-false}" == "true" ]]; then
            args+=(--force-alert)
          fi

          set +e
          node scripts/observe-operations-health.mjs \
            "${args[@]}" --format json > "${artifacts_dir}/observation.json"
          json_exit=$?
          node scripts/observe-operations-health.mjs \
            "${args[@]}" --format markdown > "${artifacts_dir}/observation.md"
          markdown_exit=$?
          set -e

          status="$(node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(report.status);' "${artifacts_dir}/observation.json")"
          if [[ ! "${status}" =~ ^(healthy|alert)$ ]]; then
            status=alert
          fi
          printf 'status=%s\n' "${status}" >> "${GITHUB_OUTPUT}"
          printf 'artifact_path=%s\n' "${artifacts_dir}" >> "${GITHUB_OUTPUT}"
          cat "${artifacts_dir}/observation.md" >> "${GITHUB_STEP_SUMMARY}"
          if (( json_exit != 0 || markdown_exit != 0 )); then
            exit 1
          fi
      - name: Retain daily, manual, and alert evidence
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '3 5 * * *' || steps.evaluate.outputs.status == 'alert') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-operations-observation-${{ github.run_id }}
          path: ${{ steps.evaluate.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 30
      - name: Reconcile external alert issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVATION_PATH: ${{ steps.evaluate.outputs.artifact_path }}
          OBSERVATION_STATUS: ${{ steps.evaluate.outputs.status }}
        run: |
          set -euo pipefail
          title="Staging operations monitor alert"
          status="${OBSERVATION_STATUS:-alert}"
          report="${OBSERVATION_PATH:-${RUNNER_TEMP}/operations-monitor-artifacts}/observation.md"
          if [[ ! -f "${report}" ]]; then
            install -d -m 700 "$(dirname "${report}")"
            printf '%s\n' '# Staging operations observation' '' '- Status: `alert`' '- Alert reason: `observation_evaluation_failed`' > "${report}"
          fi
          issue_number="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq 'map(select(.title == "Staging operations monitor alert")) | first | .number // empty')"
          if [[ "${status}" == "alert" ]]; then
            if [[ -n "${issue_number}" ]]; then
              gh issue comment "${issue_number}" --repo "${GITHUB_REPOSITORY}" --body-file "${report}"
            else
              gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${report}"
            fi
            exit 1
          fi
          if [[ -n "${issue_number}" ]]; then
            gh issue comment "${issue_number}" --repo "${GITHUB_REPOSITORY}" --body-file "${report}"
            gh issue close "${issue_number}" --repo "${GITHUB_REPOSITORY}" --reason completed
          fi
